version: "3.7"

services:
  nginx:
    build:
      context: ./Docker/nginx
    ports:
      - "8084:80"
    volumes:
      - ./:/var/www/html # Отобразите на компе и куда переносим его(тоже место и в конфиге root
    networks:
      - backend
    env_file:
      - .env


  php:
    build:
      context: ./Docker/php
    ports:
      - "9000:9000"  #  Обычно PHP-FPM слушает порт 9000
    volumes:
      - ./:/var/www/html  #  Отобразите ваш проект в контейнер
    networks:
      - backend
    env_file:
      - .env

  db:
    image: mysql:8.0
    container_name: db
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}"
      - MYSQL_DATABASE=${DB_DATABASE}"
    volumes:
      - db-data-test:/var/lib/mysql
      - ./init.sql :/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend
    env_file:
      - .env


networks:
  backend:


volumes:
  db-data-test: #создание одноименной папки для сохранения бд на локальном компе
    driver: local